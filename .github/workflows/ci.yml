name: CI

on:
  push:
  pull_request:

jobs:
  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Hide the SDK so this job proves the core builds without Android.
      - run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :core:test
        working-directory: android

  android-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :notifications:assembleDebug :notifications:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-report
          path: android/notifications/build/reports/

  ios-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/PrayerCore

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Boot a simulator with a fixed location
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if d['name'].startswith('iPhone')))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl privacy "$udid" grant location io.github.rabayabagum.prayertime
          xcrun simctl location "$udid" set 43.6512,-79.3471
      # Errors and failing tests also become annotations, readable without the raw log.
      - run: |
          set -o pipefail
          xcodebuild -project PrayerTime.xcodeproj -scheme PrayerTime -destination "platform=iOS Simulator,id=$SIM_UDID" test 2>&1 | tee xcodebuild.log || {
            status=$?
            grep -E "error:|: failed|Failing tests|XCTAssert|Fatal error" xcodebuild.log | sort -u | head -40 | sed 's/^/::error::/'
            exit $status
          }
        working-directory: ios
